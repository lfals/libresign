name: Behat MariaDB

on: pull_request

permissions:
  contents: read

concurrency:
  group: behat-mariadb-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      php-version: ${{ steps.versions.outputs.php-available-list }}
      server-max: ${{ steps.versions.outputs.branches-max-list }}
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version matrix
        id: versions
        uses: icewind1991/nextcloud-version-matrix@cd0211ffcef1065e2020cd579e4843b8746e7a58 # v1.3.3.3.1.3.3

  changes:
    runs-on: ubuntu-latest

    outputs:
      src: ${{ steps.changes.outputs.src}}

    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        continue-on-error: true
        with:
          filters: |
            src:
              - '.github/workflows/behat*'
              - 'appinfo/**'
              - 'lib/**'
              - 'templates/**'
              - 'tests/**'
              - '3rdparty/**'
              - 'vendor-bin/**'
              - '.php-cs-fixer.dist.php'
              - 'composer.json'
              - 'composer.lock'

  behat-mariadb:
    runs-on: ubuntu-latest

    needs: [changes, matrix]
    if: needs.changes.outputs.src != 'false'

    strategy:
      fail-fast: false
      matrix:
        php-versions: ${{ fromJson(needs.matrix.outputs.php-version) }}
        server-versions: ${{ fromJson(needs.matrix.outputs.server-max) }}
        mariadb-versions: ['10.6', '10.11']
        # Flat shard key so `act --matrix shard:sign` can select a single cell.
        shard: [account-admin, file-notify, page-policies, sign]
        include:
          # Unique host ports per (shard, mariadb) so act matrix cells do not collide.
          - shard: account-admin
            mariadb-versions: '10.6'
            paths: features/account features/admin features/bootstrap features/build
            db_port: 4440
            smtp_port: 1020
            mail_ui_port: 8020
          - shard: file-notify
            mariadb-versions: '10.6'
            paths: features/file features/identify-account features/notification
            db_port: 4441
            smtp_port: 1021
            mail_ui_port: 8021
          - shard: page-policies
            mariadb-versions: '10.6'
            paths: features/page features/policies features/settings
            db_port: 4442
            smtp_port: 1022
            mail_ui_port: 8022
          - shard: sign
            mariadb-versions: '10.6'
            paths: features/sign
            db_port: 4443
            smtp_port: 1023
            mail_ui_port: 8023
          - shard: account-admin
            mariadb-versions: '10.11'
            paths: features/account features/admin features/bootstrap features/build
            db_port: 4450
            smtp_port: 1030
            mail_ui_port: 8030
          - shard: file-notify
            mariadb-versions: '10.11'
            paths: features/file features/identify-account features/notification
            db_port: 4451
            smtp_port: 1031
            mail_ui_port: 8031
          - shard: page-policies
            mariadb-versions: '10.11'
            paths: features/page features/policies features/settings
            db_port: 4452
            smtp_port: 1032
            mail_ui_port: 8032
          - shard: sign
            mariadb-versions: '10.11'
            paths: features/sign
            db_port: 4453
            smtp_port: 1033
            mail_ui_port: 8033

    name: MariaDB ${{ matrix.mariadb-versions }} PHP ${{ matrix.php-versions }} Nextcloud ${{ matrix.server-versions }} (${{ matrix.shard }})

    services:
      mariadb:
        image: ghcr.io/nextcloud/continuous-integration-mariadb-${{ matrix.mariadb-versions }}:latest
        # act runs the job on host networking, so services must be reached via 127.0.0.1.
        # Unique matrix.db_port avoids Bind collisions when act expands the matrix locally.
        ports:
          - ${{ matrix.db_port }}:3306/tcp
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword" --health-interval 5s --health-timeout 2s --health-retries 5
      mailpit:
        image: axllent/mailpit
        ports:
          - ${{ matrix.mail_ui_port }}:8025/tcp
          - ${{ matrix.smtp_port }}:1025/tcp

    steps:
      - name: Set app env
        run: |
          # Split and keep last
          echo "APP_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Install system dependencies
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y poppler-utils procps

      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          repository: nextcloud/server
          ref: ${{ matrix.server-versions }}

      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          path: apps/${{ env.APP_NAME }}

      # act often copies the worktree without initializing gitlinks; composer classmap needs 3rdparty/composer.
      - name: Ensure LibreSign 3rdparty is present
        working-directory: apps/${{ env.APP_NAME }}
        run: |
          if [ -d 3rdparty/composer ]; then
            echo "3rdparty already present"
            exit 0
          fi
          THIRDPARTY_SHA="$(git rev-parse HEAD:3rdparty 2>/dev/null || true)"
          rm -rf 3rdparty
          git clone https://github.com/LibreSign/3rdparty.git 3rdparty
          if [ -n "$THIRDPARTY_SHA" ]; then
            git -C 3rdparty checkout --force "$THIRDPARTY_SHA"
          fi

      - name: Set up php ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: phpunit
          # https://docs.nextcloud.com/server/stable/admin_manual/installation/source_installation.html#prerequisites-for-manual-installation
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, mysql, pdo_mysql, imagick
          coverage: none
          ini-file: development
          # Required: re-enable pcntl_* functions that may be disabled via disable_functions
          ini-values: disable_functions=
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable ONLY_FULL_GROUP_BY MariaDB option
        run: |
          echo "SET GLOBAL sql_mode=(SELECT CONCAT(@@sql_mode,',ONLY_FULL_GROUP_BY'));" | mysql -h 127.0.0.1 -P ${{ matrix.db_port }} -u root -prootpassword
          echo "SELECT @@sql_mode;" | mysql -h 127.0.0.1 -P ${{ matrix.db_port }} -u root -prootpassword

      - name: Set up dependencies
        working-directory: apps/${{ env.APP_NAME }}
        run: |
          composer remove nextcloud/ocp --dev --no-scripts
          composer install --no-dev
          composer --working-dir=tests/integration install

      - name: Set up Nextcloud
        run: |
          sudo echo "127.0.0.1 mailpit" | sudo tee -a /etc/hosts
          mkdir data
          ./occ maintenance:install \
            --verbose \
            --database=mysql \
            --database-name=nextcloud \
            --database-host=127.0.0.1 \
            --database-port=${{ matrix.db_port }} \
            --database-user=root \
            --database-pass=rootpassword \
            --admin-user admin \
            --admin-pass admin
          ./occ --version
          ./occ app:enable --force ${{ env.APP_NAME }}
          git clone --depth 1 -b ${{ matrix.server-versions }} https://github.com/nextcloud/notifications apps/notifications
          composer --working-dir=apps/notifications install --no-dev
          ./occ app:enable --force notifications
          git clone --depth 1 -b ${{ matrix.server-versions }} https://github.com/nextcloud/activity apps/activity
          composer --working-dir=apps/activity install --no-dev
          ./occ app:enable --force activity
          git clone --depth 1 -b main https://github.com/nextcloud/guests apps/guests
          composer --working-dir=apps/guests install --no-dev
          ./occ app:enable --force guests
          ./occ config:system:set allow_local_remote_servers --value true --type boolean
          ./occ config:system:set auth.bruteforce.protection.enabled --value false --type boolean
          ./occ config:system:set mail_smtphost --value mailpit
          ./occ config:system:set mail_smtpport --value ${{ matrix.smtp_port }} --type integer
          ./occ config:system:set ratelimit.protection.enabled --value false --type boolean
          ./occ config:app:set dav enableDefaultContact --value false --type boolean

      - name: Run behat
        working-directory: apps/${{ env.APP_NAME }}/tests/integration
        env:
          BEHAT_ROOT_DIR: ../../../../
        run: |
          # act images often lack procps and a runner user; RunServerListener needs both.
          # FeatureContext also requires the Behat process UID to match BEHAT_RUN_AS / file owner.
          if [ "${ACT}" = "true" ]; then
            id -u runner >/dev/null 2>&1 || useradd -m -s /bin/bash runner
            NC_ROOT="$(cd ../../../.. && pwd)"
            chown -R runner:runner "$NC_ROOT"
            # shellcheck disable=SC2086
            # Drop GITHUB_ACTIONS so RunServerListener does not wrap php -S in sudo
            # (behat already runs as runner; act's runner user has no passwordless sudo).
            runuser -u runner -- env -u GITHUB_ACTIONS \
              BEHAT_RUN_AS=runner \
              BEHAT_ROOT_DIR=../../../../ \
              BEHAT_VERBOSE="${RUNNER_DEBUG:-}" \
              HOME=/home/runner \
              vendor/bin/behat -f junit -f pretty --colors ${{ matrix.paths }}
          else
            export BEHAT_RUN_AS=runner
            export BEHAT_VERBOSE="$RUNNER_DEBUG"
            # shellcheck disable=SC2086
            vendor/bin/behat -f junit -f pretty --colors ${{ matrix.paths }}
          fi

      - name: Print logs
        if: always()
        run: |
          cat data/nextcloud.log 2>/dev/null || echo "No nextcloud.log yet"

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [changes, behat-mariadb]

    if: always()

    name: behat-mariadb-summary

    steps:
      - name: Summary status
        run: if ${{ needs.changes.outputs.src != 'false' && needs.behat-mariadb.result != 'success' }}; then exit 1; fi
