name: Behat PostgreSQL

on: pull_request

permissions:
  contents: read

concurrency:
  group: behat-pgsql-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      php-version: ${{ steps.versions.outputs.php-available-list }}
      server-max: ${{ steps.versions.outputs.branches-max-list }}
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get version matrix
        id: versions
        uses: icewind1991/nextcloud-version-matrix@cd0211ffcef1065e2020cd579e4843b8746e7a58 # v1.3.3.3.1.3.3

  changes:
    runs-on: ubuntu-latest

    outputs:
      src: ${{ steps.changes.outputs.src}}

    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        continue-on-error: true
        with:
          filters: |
            src:
              - '.github/workflows/behat*'
              - 'appinfo/**'
              - 'lib/**'
              - 'templates/**'
              - 'tests/**'
              - '3rdparty/**'
              - 'vendor-bin/**'
              - '.php-cs-fixer.dist.php'
              - 'composer.json'
              - 'composer.lock'

  behat-pgsql:
    runs-on: ubuntu-latest

    needs: [changes, matrix]
    if: needs.changes.outputs.src != 'false'

    strategy:
      matrix:
        php-versions: ${{ fromJson(needs.matrix.outputs.php-version) }}
        server-versions: ${{ fromJson(needs.matrix.outputs.server-max) }}

    name: PostgreSQL PHP ${{ matrix.php-versions }} Nextcloud ${{ matrix.server-versions }}

    services:
      postgres:
        image: ghcr.io/nextcloud/continuous-integration-postgres-14:latest
        ports:
          - 4444:5432/tcp
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: rootpassword
          POSTGRES_DB: nextcloud
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 2s --health-retries 5
      mailpit:
        image: axllent/mailpit
        ports:
          - 8025:8025/tcp
          - 1025:1025/tcp

    steps:
      - name: Set app env
        run: |
          # Split and keep last
          echo "APP_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Install system dependencies
        run: sudo apt update && sudo apt install poppler-utils gdb systemd-coredump

      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          repository: nextcloud/server
          ref: ${{ matrix.server-versions }}

      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          path: apps/${{ env.APP_NAME }}

      - name: Set up php ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: phpunit
          # https://docs.nextcloud.com/server/stable/admin_manual/installation/source_installation.html#prerequisites-for-manual-installation
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, pgsql, pdo_pgsql, imagick
          coverage: none
          ini-file: development
          # Required: re-enable pcntl_* functions that may be disabled via disable_functions
          # Disable JIT so a worker SIGSEGV has a readable PHP frame, not n/a.
          ini-values: disable_functions=, opcache.jit=disable, opcache.jit_buffer_size=0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check composer file existence
        id: check_composer
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
        with:
          files: apps/${{ env.APP_NAME }}/composer.json

      - name: Set up dependencies
        # Only run if phpunit config file exists
        if: steps.check_composer.outputs.files_exists == 'true'
        working-directory: apps/${{ env.APP_NAME }}
        run: |
          composer remove nextcloud/ocp --dev --no-scripts
          composer install --no-dev
          composer --working-dir=tests/integration install

      - name: Set up Nextcloud
        env:
          DB_PORT: 4444
        run: |
          sudo echo "127.0.0.1 mailpit" | sudo tee -a /etc/hosts
          mkdir data
          ./occ maintenance:install \
            --verbose \
            --database=pgsql \
            --database-name=nextcloud \
            --database-host=127.0.0.1 \
            --database-port=$DB_PORT \
            --database-user=root \
            --database-pass=rootpassword \
            --admin-user admin \
            --admin-pass admin
          ./occ --version
          ./occ app:enable --force ${{ env.APP_NAME }}
          git clone --depth 1 -b ${{ matrix.server-versions }} https://github.com/nextcloud/notifications apps/notifications
          composer --working-dir=apps/notifications install --no-dev
          ./occ app:enable --force notifications
          git clone --depth 1 -b ${{ matrix.server-versions }} https://github.com/nextcloud/activity apps/activity
          composer --working-dir=apps/activity install --no-dev
          ./occ app:enable --force activity
          git clone --depth 1 -b main https://github.com/nextcloud/guests apps/guests
          composer --working-dir=apps/guests install --no-dev
          ./occ app:enable --force guests
          ./occ config:system:set allow_local_remote_servers --value true --type boolean
          ./occ config:system:set auth.bruteforce.protection.enabled --value false --type boolean
          ./occ config:system:set mail_smtphost --value mailpit
          ./occ config:system:set mail_smtpport --value 1025 --type integer
          ./occ config:system:set ratelimit.protection.enabled --value false --type boolean
          ./occ config:app:set dav enableDefaultContact --value false --type boolean

      - name: Run behat
        working-directory: apps/${{ env.APP_NAME }}/tests/integration
        env:
          BEHAT_ROOT_DIR: ../../../../
          # Probe: real php -S + original workers 10. FrankenPHP hid cURL 52.
          BEHAT_WORKERS: "10"
          BEHAT_HOST: "127.0.0.1"
          # Capture worker PID, accept/close, and unexpected-death diagnostics.
          BEHAT_VERBOSE: "1"
        run: |
          export BEHAT_RUN_AS=runner
          # shellcheck disable=SC2086
          vendor/bin/behat -v -f junit -f pretty --colors

      - name: Print logs
        if: always()
        run: |
          echo "=== Behat web server processes ==="
          ps aux | grep -E '[p]hp -S|[f]rankenphp' || echo "No Behat web server process"
          echo "=== php -S verbose diagnostics ==="
          shopt -s nullglob
          files=(/tmp/behat-php-server-*)
          if (( ${#files[@]} )); then
            ls -la "${files[@]}"
            for f in "${files[@]}"; do
              echo "----- $f -----"
              cat "$f"
            done
          else
            echo "No /tmp/behat-php-server-* files"
          fi
          echo "=== nextcloud.log ==="
          cat data/nextcloud.log

      - name: Backtrace PHP core dumps
        if: failure()
        run: |
          sudo coredumpctl --no-pager list || true
          {
            echo "===== latest php core ====="
            sudo coredumpctl --no-pager info || true
            echo "===== gdb bt full ====="
            sudo coredumpctl --no-pager debug --debugger=gdb --debugger-arguments="-batch -ex 'set pagination off' -ex 'thread apply all bt full' -ex 'info registers' -ex 'info sharedlibrary'" || true
          } | tee /tmp/php-s-gdb-bt.txt

      - name: Upload PHP server diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: behat-pgsql-server-diagnostics-php${{ matrix.php-versions }}-nc${{ matrix.server-versions }}
          path: |
            /tmp/behat-php-server-*
            /tmp/php-s-gdb-bt.txt
          if-no-files-found: ignore

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [changes, behat-pgsql]

    if: always()

    name: behat-pgsql-summary

    steps:
      - name: Summary status
        run: if ${{ needs.changes.outputs.src != 'false' && needs.behat-pgsql.result != 'success' }}; then exit 1; fi
